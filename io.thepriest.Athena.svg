<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Dark purple background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#1e0a30"/>
      <stop offset="100%" stop-color="#0c0618"/>
    </linearGradient>
    <!-- Magenta glow behind the A -->
    <radialGradient id="glow" cx="0.5" cy="0.55" r="0.48">
      <stop offset="0%"  stop-color="#cc44ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#cc44ff" stop-opacity="0"/>
    </radialGradient>
    <!-- Magenta to cyan gradient for the A letterform -->
    <linearGradient id="letter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#e066ff"/>
      <stop offset="100%" stop-color="#aa33ee"/>
    </linearGradient>
    <!-- Subtle inner glow on stroke -->
    <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect x="0" y="0" width="128" height="128" rx="24" ry="24" fill="url(#bg)"/>
  <!-- Soft glow orb -->
  <ellipse cx="64" cy="70" rx="46" ry="42" fill="url(#glow)"/>

  <!-- Main A letterform — clean geometric, thick strokes, works at 32px+ -->
  <g filter="url(#bloom)">
    <!-- Left diagonal leg of A -->
    <polygon
      points="64,14  30,106  42,106  64,42  86,106  98,106  64,14"
      fill="url(#letter)"
    />
    <!-- Crossbar — cuts out the inner triangle to create the A shape -->
    <rect x="43" y="70" width="42" height="11" rx="2" fill="#0c0618"/>
  </g>

  <!-- Two owl eyes as cyan dots inside the A counter (stylized) -->
  <!-- Eye left -->
  <circle cx="52" cy="87" r="5.5" fill="#0c0618"/>
  <circle cx="52" cy="87" r="3"   fill="#00d4ff" opacity="0.9"/>
  <circle cx="52" cy="87" r="1.4" fill="#0c0618"/>
  <!-- Eye right -->
  <circle cx="76" cy="87" r="5.5" fill="#0c0618"/>
  <circle cx="76" cy="87" r="3"   fill="#00d4ff" opacity="0.9"/>
  <circle cx="76" cy="87" r="1.4" fill="#0c0618"/>

  <!-- Bottom text: ATHENA in tiny caps for context at large sizes -->
  <text x="64" y="121"
        font-family="monospace,sans-serif"
        font-size="8.5"
        font-weight="bold"
        letter-spacing="3.5"
        fill="#cc44ff"
        opacity="0.75"
        text-anchor="middle">ATHENA</text>
</svg>
